# Keeps the Supabase project awake: free-plan projects pause after about a week without activity.
# Once a day this reads one row through the REST API with the public anon key (the same key the site ships).
# A failed run (e.g. the project already paused) shows red in Actions and GitHub emails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          URL: https://fsbnndmryjbowquzdtfq.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzYm5uZG1yeWpib3dxdXpkdGZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTkzNTcsImV4cCI6MjEwNDU5NTM1N30.o6rbm5kdo8g0FMbYVxRjXschvzf9Ee1ieNjcXXR-A9A
        run: |
          code=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/goa2_maps?select=id&limit=1")
          echo "HTTP $code"; head -c 300 body.txt; echo
          test "$code" -ge 200 -a "$code" -lt 300
