name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stats-of-atlantis-replica-hg5nv2
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site = the RELEASE (branch `release`) at /goa2/. Launched 2026-10-09; before that 1.0 sat here,
      # 2.0 at /goa2/v2/ and the release at /goa2/v1/ — those two addresses now only send people home.
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Build
        env:
          BASE_PATH: /goa2
        run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r build/. site/
          # old addresses (/goa2/v1/…, /goa2/v2/…) and any other missing page → home, keeping ?room links
          cat > site/404.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GoA2</title>
          <script>location.replace('/goa2/' + location.search + location.hash)</script></head>
          <body style="background:#0c1220;color:#f5f1e8;font-family:sans-serif"><p><a href="/goa2/" style="color:#d8b36a">GoA2</a></p></body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
