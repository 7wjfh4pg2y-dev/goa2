name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stats-of-atlantis-replica-hg5nv2
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The game moved to https://goa2digital.pages.dev/ (2026-10-11): Cloudflare Pages builds the `release`
      # branch on every push. This old address only forwards there, keeping the page and any ?room= invite:
      # /goa2/stats?x → /stats?x; the long-gone /goa2/v1/… and /goa2/v2/… addresses → home.
      - name: Assemble the redirect
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GoA2 has moved</title>
          <meta name="robots" content="noindex">
          <script>
          (function () {
            var p = location.pathname.replace(/^\/goa2(?=\/|$)/, '') || '/';
            if (/^\/v[12](\/|$)/.test(p)) p = '/';
            p = p.replace(/\.html$/, '').replace(/\/index$/, '/');
            location.replace('https://goa2digital.pages.dev' + p + location.search + location.hash);
          })();
          </script>
          <noscript><meta http-equiv="refresh" content="0; url=https://goa2digital.pages.dev/"></noscript>
          </head>
          <body style="background:#0c1220;color:#f5f1e8;font-family:sans-serif;padding:24px">
          <p>GoA2 has moved to <a href="https://goa2digital.pages.dev/" style="color:#d8b36a">goa2digital.pages.dev</a>.</p>
          </body></html>
          HTML
          cp site/index.html site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
