name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/stats-of-atlantis-replica-hg5nv2
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx vitest run

      # Two versions side by side; the GM's site version switch (src/lib/siteVersion.ts)
      # sends everyone to whichever one is live:
      #   1.0 (branch `1.0`)          → /goa2/
      #   2.0 (this branch)           → /goa2/v2/
      - name: Build version 2.0
        env:
          BASE_PATH: /goa2/v2
        run: npm run build

      - name: Checkout version 1.0
        uses: actions/checkout@v4
        with:
          ref: '1.0'
          path: v1src

      - name: Build version 1.0
        working-directory: v1src
        env:
          BASE_PATH: /goa2
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site/v2
          cp -r v1src/build/. site/
          cp -r build/. site/v2/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
