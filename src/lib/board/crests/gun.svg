<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
<!-- tripod -->
<path d="M0,6 L0,34" fill="none" stroke="#dccfb0" stroke-width="5.5" stroke-linecap="round"/>
<g fill="none" stroke="#f4ecd9" stroke-width="6.5" stroke-linecap="round">
<path d="M0,6 L-28,30"/><path d="M0,6 L28,30"/>
</g>
<!-- neck + pintle pivot -->
<path d="M0,-9 L0,6" stroke="#dccfb0" stroke-width="8" stroke-linecap="round"/>
<circle cx="0" cy="6" r="7" fill="#f4ecd9"/>
<circle cx="0" cy="6" r="2.6" fill="#12161e"/>
<g transform="translate(0 -14) rotate(-6)">
<!-- muzzle flash -->
<path d="M42.5,1 C37,9 31,13.5 25.5,11 Q22,6 22.5,0 Q22,-7 25.5,-10.5 C29,-14 33.5,-9.5 36.5,-8 C34.5,-4.5 39,-1 42.5,1 Z" fill="#ef7d22"/>
<path d="M38,1 C34,6 30,7.5 27,6 Q25,3 25,0 Q25,-4 27,-6 C31,-7 34,-2.5 38,1 Z" fill="#ffd166"/>
<!-- barrel jacket + muzzle -->
<rect x="-18" y="-7.5" width="34" height="15" rx="5.5" fill="#f4ecd9"/>
<rect x="-15" y="3.8" width="29" height="3.4" rx="1.7" fill="#dccfb0"/>
<rect x="15" y="-3" width="7" height="6" fill="#dccfb0"/>
<rect x="20" y="-5.5" width="5.5" height="11" rx="2" fill="#f4ecd9"/>
<circle cx="-8.5" cy="-1" r="3.2" fill="#12161e"/>
<circle cx="1" cy="-1" r="3.2" fill="#12161e"/>
<circle cx="10.5" cy="-1" r="3.2" fill="#12161e"/>
<rect x="9" y="-12" width="4" height="5.5" rx="1.2" fill="#f4ecd9"/>
<!-- spade grips -->
<path d="M-34,-8 L-39,-8 L-39,5.5 L-34,5.5" fill="none" stroke="#f4ecd9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<!-- belt, feeding in from below -->
<g fill="#ffd166">
<rect x="-34" y="8" width="3.4" height="10" rx="1.7"/>
<rect x="-29.7" y="8" width="3.4" height="10" rx="1.7"/>
<rect x="-25.4" y="8" width="3.4" height="10" rx="1.7"/>
</g>
<!-- receiver -->
<rect x="-35" y="-13" width="19" height="22" rx="4" fill="#f4ecd9"/>
<rect x="-35" y="3" width="19" height="6" rx="3" fill="#dccfb0"/>
<rect x="-31.5" y="-18" width="6" height="6" rx="1.4" fill="#f4ecd9"/>
<rect x="-31.5" y="-8.4" width="12" height="4.8" rx="2.4" fill="#12161e"/>
<!-- ammo box -->
<rect x="-38.5" y="15" width="17" height="11" rx="2.6" fill="#4cc2c8"/>
<rect x="-38.5" y="21" width="17" height="5" rx="2.5" fill="#2c8f9c"/>
<rect x="-32.8" y="16.6" width="5.6" height="3.4" rx="1.5" fill="#f4ecd9"/>
</g>
</svg>
