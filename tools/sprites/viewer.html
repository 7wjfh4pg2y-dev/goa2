<title>GoA2 Hero Sprites</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
	:root {
		color-scheme: dark;
		--bg: #0e1412; --panel: #151d1a; --panel2: #1b2521; --line: rgba(206, 170, 96, 0.28); --line2: rgba(255, 255, 255, 0.08);
		--ink: #efe6d2; --dim: #a89f8a; --brass: #d6ad62; --copper: #e0763a; --teal: #45c6b1; --leaf: #b4d65a;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Alegreya Sans', system-ui, sans-serif; }
	.wrap { max-width: 1180px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
	header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
	.kick { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--teal); }
	h1 { margin: 2px 0 0; font: 700 clamp(28px, 4vw, 40px)/1.05 Cinzel, Georgia, serif; letter-spacing: 0.03em; }
	h1 span { color: var(--copper); }
	.sub { color: var(--dim); font-size: 15px; max-width: 60ch; }
	.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
	.sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); background: var(--panel); border: 1px solid var(--line2); border-radius: 999px; padding: 3px 9px 3px 4px; }
	.sw i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4); }

	.main { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; }
	@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
	.stage { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16 / 10; max-width: 100%; background: #0b100e; }
	.bg { position: absolute; inset: 0; transition: opacity 0.4s; }
	.bg.glade { background: radial-gradient(120% 90% at 30% 0%, #d9e98a 0%, #7fae44 22%, #2e5a26 55%, #10220f 100%); }
	.bg.glade::before { content: ''; position: absolute; inset: -20%; background: repeating-linear-gradient(115deg, rgba(255, 250, 200, 0.16) 0 26px, transparent 26px 90px); mask-image: linear-gradient(180deg, #000 0%, transparent 70%); -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 70%); animation: rays 14s linear infinite; }
	@keyframes rays { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
	.bg.glade::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: linear-gradient(180deg, #1d3a17 0%, #0f200c 100%); box-shadow: 0 -2px 0 #3c6b2a; }
	.bg.night { background: radial-gradient(90% 70% at 50% 35%, #233142 0%, #121a24 60%, #090d12 100%); }
	.bg.night::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26%; background: #0d131a; box-shadow: 0 -1px 0 #2c3a4a; }
	.bg.check { background: #2a2f2d; background-image: linear-gradient(45deg, #333936 25%, transparent 25%, transparent 75%, #333936 75%), linear-gradient(45deg, #333936 25%, transparent 25%, transparent 75%, #333936 75%); background-size: 24px 24px; background-position: 0 0, 12px 12px; }
	canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
	.hud { position: absolute; left: 12px; top: 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: rgba(255, 255, 255, 0.82); text-shadow: 0 1px 2px #000; pointer-events: none; }
	.hud b { font: 700 15px Cinzel, serif; letter-spacing: 0.04em; }
	.hud .fr { font-variant-numeric: tabular-nums; opacity: 0.8; }
	.compare-tag { position: absolute; bottom: 10px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); text-shadow: 0 1px 2px #000; pointer-events: none; }

	.side { display: grid; gap: 12px; align-content: start; }
	.card { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
	.card h2 { margin: 0; font: 600 12px/1 'Alegreya Sans', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }
	.anims { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
	button { font: inherit; color: inherit; cursor: pointer; }
	.ab { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; font-size: 15px; text-align: left; }
	.ab small { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
	.ab[aria-pressed='true'] { border-color: var(--brass); background: linear-gradient(180deg, #2a2a1c, #1f2318); box-shadow: inset 0 0 0 1px rgba(214, 173, 98, 0.25); }
	.ab.reel { grid-column: 1 / -1; justify-content: center; border-style: dashed; color: var(--leaf); }
	.row { display: flex; gap: 6px; flex-wrap: wrap; }
	.tb { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
	.tb[aria-pressed='true'] { border-color: var(--teal); color: #dffcf6; background: #173029; }
	.tb kbd { font: 11px/1 'Alegreya Sans', sans-serif; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 2px 4px; }
	.speed { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); }
	.speed input { width: 100%; accent-color: var(--brass); }
	.speed output { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
	.play { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; }
	.play .tb { justify-content: center; }
	#pp { background: linear-gradient(180deg, #c99a49, #9c7330); color: #1b140a; border-color: #e2bd73; font-weight: 700; }

	.strip { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 10px; overflow-x: auto; }
	.frames { display: flex; gap: 6px; }
	.fb { flex: 0 0 auto; background: #0f1513; border: 1px solid var(--line2); border-radius: 6px; padding: 4px; display: grid; gap: 2px; justify-items: center; }
	.fb canvas { display: block; image-rendering: pixelated; }
	.fb span { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
	.fb.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px rgba(214, 173, 98, 0.4); }
	.fb.on span { color: var(--brass); }
	.notes { color: var(--dim); font-size: 14px; display: grid; gap: 4px; }
	.notes b { color: var(--ink); font-weight: 500; }
	.heroes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
	.heroes:empty { display: none; }
	.hp { background: var(--panel); border: 1px solid var(--line2); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
	.hp[aria-pressed='true'] { border-color: var(--brass); color: var(--brass); }
	.basetag { color: var(--dim); font-size: 13px; margin-top: 4px; }
</style>

<div class="wrap">
	<header>
		<div>
			<div class="kick">Hero sprites · Guards of Atlantis II</div>
			<h1 id="htitle">Hero</h1>
			<div class="sub" id="hblurb"></div>
			<div class="heroes" id="heroes"></div>
		</div>
		<div class="swatches" id="sw"></div>
	</header>

	<div class="main">
		<div class="stage" id="stage">
			<div class="bg glade" id="bg"></div>
			<canvas id="cv"></canvas>
			<div class="hud"><b id="hname">Idle</b><span class="fr" id="hframe">1 / 10</span></div>
		</div>
		<div class="side">
			<div class="card">
				<h2>Animation</h2>
				<div class="anims" id="anims"></div>
			</div>
			<div class="card">
				<h2>Playback</h2>
				<div class="play">
					<button class="tb" id="prev" aria-label="Previous frame">‹</button>
					<button class="tb" id="pp">Pause</button>
					<button class="tb" id="next" aria-label="Next frame">›</button>
				</div>
				<label class="speed">Speed <input id="spd" type="range" min="2" max="24" step="1" value="10"><output id="spdo">10 fps</output></label>
				<div class="row">
					<button class="tb" data-t="flip" aria-pressed="false">Mirror <kbd>M</kbd></button>
					<button class="tb" data-t="onion" aria-pressed="false">Onion skin <kbd>O</kbd></button>
					<button class="tb" data-t="compare" aria-pressed="false">Before / after <kbd>C</kbd></button>
				</div>
			</div>
			<div class="card">
				<h2>Backdrop</h2>
				<div class="row" id="bgs">
					<button class="tb" data-bg="glade" aria-pressed="true">Glade</button>
					<button class="tb" data-bg="night" aria-pressed="false">Night</button>
					<button class="tb" data-bg="check" aria-pressed="false">Checker</button>
				</div>
			</div>
		</div>
	</div>

	<div class="strip"><div class="frames" id="frames"></div></div>
	<div class="notes">
		<div id="hbase" class="basetag"></div>
		<div><b>Keys:</b> Space play / pause · ← → step a frame · ↑ ↓ change animation · M mirror · O onion skin · C before / after.</div>
	</div>
</div>
